name: Deploy US Tech Monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 09:17 Asia/Shanghai, Tuesday-Saturday: after the prior U.S. session closes.
    - cron: "17 1 * * 2-6"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-us.lock

      - name: Restore market-data cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/cache
          key: us-tech-market-${{ runner.os }}-${{ hashFiles('requirements-us.lock') }}-${{ github.run_id }}
          restore-keys: |
            us-tech-market-${{ runner.os }}-${{ hashFiles('requirements-us.lock') }}-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-us.lock

      - name: Run tests
        run: python -m pytest

      - name: Check dashboard JavaScript
        run: node --check web/app.js

      - name: Build refreshed market data
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python run_us_monitor.py build --refresh --json; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Validate generated artifacts
        run: python run_us_monitor.py doctor

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/data _site/web
          cp web/index.html web/app.js web/styles.css _site/
          cp web/index.html web/app.js web/styles.css _site/web/
          cp data/us_tech_snapshot.json data/backtest_results.json _site/data/
          touch _site/.nojekyll

          expected_files="$(printf '%s\n' \
            .nojekyll \
            app.js \
            data/backtest_results.json \
            data/us_tech_snapshot.json \
            index.html \
            styles.css \
            web/app.js \
            web/index.html \
            web/styles.css | sort)"
          actual_files="$(find _site -type f -printf '%P\n' | sort)"
          printf '%s\n' "$actual_files"
          if [ "$actual_files" != "$expected_files" ]; then
            echo "Unexpected file in Pages artifact." >&2
            diff -u <(printf '%s\n' "$expected_files") <(printf '%s\n' "$actual_files") || true
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
