name: Deploy US Tech Monitor

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 09:17 Asia/Shanghai, Tuesday-Saturday: after the prior U.S. session closes.
    - cron: "17 1 * * 2-6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-us.txt

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: us-tech-market-${{ runner.os }}-${{ hashFiles('requirements-us.txt') }}-${{ github.run_id }}
          restore-keys: |
            us-tech-market-${{ runner.os }}-${{ hashFiles('requirements-us.txt') }}-

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-us.txt

      - name: Run tests
        run: python -m pytest

      - name: Check dashboard JavaScript
        run: node --check web/app.js

      - name: Build refreshed market data
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python run_us_monitor.py build --refresh --json; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 20
          done

      - name: Validate generated artifacts
        run: python run_us_monitor.py doctor

      - name: Assemble static site
        shell: bash
        run: |
          mkdir -p _site/data _site/web
          cp web/index.html web/app.js web/styles.css _site/
          cp -R web/. _site/web/
          cp data/us_tech_snapshot.json data/backtest_results.json _site/data/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
